packages:
  - "apps/*"
  - "packages/*"
# pnpm >= 10 blocks dependency build scripts by default; these need theirs (prisma generate, native addons)
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
  "@scarf/scarf": false
# @types/swagger-ui-express floats @types/express, which otherwise resolves v5 alongside our v4
# runtime and makes the two Request types incompatible. Pin one copy for the whole workspace.
overrides:
  "@types/express": "^4.17.21"
