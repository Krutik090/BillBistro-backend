name: ci
on:
  push:
    branches: [main, "phase*"]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: billbistro }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://billbistro_app:app@localhost:5433/billbistro?schema=public
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5433/billbistro?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Create RLS app role
        run: psql "$DATABASE_URL_MIGRATE" -f infra/postgres/init.sql
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: RLS isolation proof (basic)
        run: npm run db:rls-check
      - name: Money math gate (MERGE BLOCKER — pure/deterministic, scripts/money-check.ts)
        run: npm run check:money
      - name: Tenant isolation gate (MERGE BLOCKER — RLS coverage guard + planted-leak canary + per-model sweep)
        run: npm run db:iso-check
      - run: npm run build --workspace=@billbistro/types
      - run: npm run typecheck --workspace=@billbistro/api
      - run: npm run build --workspace=@billbistro/api
      - name: Start API for behavioural probes
        run: |
          node apps/api/dist/server.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health && break; sleep 1; done
      - name: Hardening probes (423 lockout / 429 throttle) — NON-blocking until proven stable
        continue-on-error: true
        run: npm run db:hardening-check
        env: { API_URL: http://localhost:4000 }
      - name: Orders runtime e2e (T-102 totals / idempotency / concurrency) — NON-blocking until proven stable
        continue-on-error: true
        run: npm run db:orders-e2e
        env: { API_URL: http://localhost:4000 }
      - name: Billing runtime e2e (T-103 totals / idempotency / split-merge / day-close) — NON-blocking until proven stable
        continue-on-error: true
        run: npm run db:billing-e2e
        env: { API_URL: http://localhost:4000 }
      - name: Reports runtime e2e (T-104 sales/items/tax deltas) — NON-blocking until proven stable
        continue-on-error: true
        run: npm run db:reports-e2e
        env: { API_URL: http://localhost:4000 }
      - name: Signup runtime e2e (T-106 self-serve onboarding) — NON-blocking until proven stable
        continue-on-error: true
        run: npm run db:signup-e2e
        env: { API_URL: http://localhost:4000 }
      - name: API log (on probe failure)
        if: always()
        run: tail -n 50 api.log || true
